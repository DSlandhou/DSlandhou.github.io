<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <style>
      .wire{fill:none;stroke:#111;stroke-width:2.5;stroke-linecap:square;stroke-linejoin:miter}
      .thin{fill:none;stroke:#111;stroke-width:1.4;stroke-linecap:square;stroke-linejoin:miter}
      .dash{fill:none;stroke:#555;stroke-width:1.5;stroke-dasharray:8 5}
      .sym{fill:#fff;stroke:#111;stroke-width:2}
      .term{fill:#fff;stroke:#111;stroke-width:2}
      .node{fill:#111}
      .txt{font:16px Arial,Helvetica,sans-serif;fill:#111}
      .small{font:13px Arial,Helvetica,sans-serif;fill:#111}
      .tiny{font:11px Arial,Helvetica,sans-serif;fill:#111}
      .head{font:bold 15px Arial,Helvetica,sans-serif;fill:#111;letter-spacing:1px}
    </style>
  </defs>

  <rect x="20" y="20" width="1760" height="1210" fill="#fff" stroke="#111" stroke-width="2"/>
  <path class="thin" d="M20 65 H1780 M20 600 H1780"/>
  <text class="head" x="50" y="51">AC POWER / MAIN CONTACT TEST LOADS</text>
  <text class="head" x="50" y="586">DC CONTROL / INDICATION</text>

  <!-- AC input terminal block -->
  <text class="txt" x="90" y="115">X1</text>
  <rect class="sym" x="85" y="135" width="75" height="280"/>
  <text class="small" x="103" y="185">L</text><text class="small" x="103" y="285">N</text><text class="small" x="96" y="385">PE</text>
  <circle class="term" cx="160" cy="180" r="5"/><circle class="term" cx="160" cy="280" r="5"/><circle class="term" cx="160" cy="380" r="5"/>

  <!-- S0 AC pole -->
  <text class="txt" x="320" y="115" text-anchor="middle">S0</text>
  <text class="tiny" x="320" y="132" text-anchor="middle">DPST MASTER SWITCH</text>
  <path class="wire" d="M165 180 H285 M355 180 H430"/>
  <circle class="term" cx="285" cy="180" r="4"/><circle class="term" cx="355" cy="180" r="4"/><path class="wire" d="M285 180 L347 148"/>
  <path class="wire" d="M165 280 H1470"/>
  <path class="wire" d="M165 380 H1470"/>
  <path class="thin" d="M1460 380 V403 M1445 403 H1475 M1449 410 H1471 M1454 417 H1466"/>
  <text class="tiny" x="1410" y="272">N</text><text class="tiny" x="1410" y="372">PE</text>

  <!-- HL AC -->
  <path class="wire" d="M405 180 V225 H470 V180"/>
  <circle class="sym" cx="438" cy="225" r="22"/><path class="thin" d="M428 225 H448 M438 215 V235"/>
  <text class="tiny" x="438" y="258" text-anchor="middle">HL_AC</text>
  <text class="tiny" x="438" y="270" text-anchor="middle">AC PWR</text>
  <path class="wire" d="M438 247 V280"/>

  <!-- Q1 and AC bus -->
  <text class="txt" x="520" y="115" text-anchor="middle">Q1</text>
  <text class="tiny" x="520" y="132" text-anchor="middle">AC CB</text>
  <path class="wire" d="M430 180 H485 M555 180 H650"/>
  <rect class="sym" x="485" y="169" width="70" height="22"/>
  <path class="wire" d="M650 180 V455"/>
  <text class="tiny" x="660" y="198">AC_BUS</text>

  <!-- KA main contacts a-d -->
  <text class="txt" x="805" y="105" text-anchor="middle">KA</text>
  <text class="small" x="805" y="124" text-anchor="middle">4 NO MAIN CONTACTS, 10 A</text>
  <text class="tiny" x="716" y="160">a</text><text class="tiny" x="716" y="215">b</text><text class="tiny" x="716" y="270">c</text><text class="tiny" x="716" y="325">d</text>
  <path class="wire" d="M650 160 H760 M835 160 H890"/><circle class="term" cx="760" cy="160" r="4"/><circle class="term" cx="835" cy="160" r="4"/><path class="wire" d="M760 160 L827 128"/>
  <path class="wire" d="M650 215 H760 M835 215 H890"/><circle class="term" cx="760" cy="215" r="4"/><circle class="term" cx="835" cy="215" r="4"/><path class="wire" d="M760 215 L827 183"/>
  <path class="wire" d="M650 270 H760 M835 270 H890"/><circle class="term" cx="760" cy="270" r="4"/><circle class="term" cx="835" cy="270" r="4"/><path class="wire" d="M760 270 L827 238"/>
  <path class="wire" d="M650 325 H760 M835 325 H890"/><circle class="term" cx="760" cy="325" r="4"/><circle class="term" cx="835" cy="325" r="4"/><path class="wire" d="M760 325 L827 293"/>
  <path class="dash" d="M797 160 V325"/>
  <rect class="sym" x="890" y="140" width="105" height="42"/><rect class="sym" x="890" y="195" width="105" height="42"/><rect class="sym" x="890" y="250" width="105" height="42"/><rect class="sym" x="890" y="305" width="105" height="42"/>
  <text class="tiny" x="943" y="166" text-anchor="middle">R_KA_A</text><text class="tiny" x="943" y="221" text-anchor="middle">R_KA_B</text><text class="tiny" x="943" y="276" text-anchor="middle">R_KA_C</text><text class="tiny" x="943" y="331" text-anchor="middle">R_KA_D</text>
  <path class="wire" d="M995 160 V280 M995 215 V280 M995 270 V280 M995 325 V280"/>

  <!-- KA auxiliary changeover -->
  <text class="small" x="790" y="385" text-anchor="middle">KA AUX CHANGEOVER</text>
  <text class="tiny" x="790" y="401" text-anchor="middle">1-2 NO / 2-3 NC</text>
  <path class="wire" d="M650 405 H760"/><circle class="term" cx="760" cy="405" r="4"/><circle class="term" cx="840" cy="365" r="4"/><circle class="term" cx="840" cy="445" r="4"/>
  <path class="wire" d="M760 405 L832 370"/><path class="thin" d="M760 405 L832 440"/>
  <text class="tiny" x="744" y="399">2</text><text class="tiny" x="846" y="360">1</text><text class="tiny" x="846" y="458">3</text>
  <rect class="sym" x="875" y="344" width="120" height="40"/><rect class="sym" x="875" y="424" width="120" height="40"/>
  <text class="tiny" x="935" y="369" text-anchor="middle">R_KA_NO</text><text class="tiny" x="935" y="449" text-anchor="middle">R_KA_NC</text>
  <path class="wire" d="M840 365 H875 M840 445 H875 M995 365 V280 M995 445 V280"/>

  <!-- KM main contacts -->
  <text class="txt" x="1220" y="105" text-anchor="middle">KM</text>
  <text class="small" x="1220" y="124" text-anchor="middle">3 NO MAIN CONTACTS, 25 A</text>
  <text class="tiny" x="1130" y="180">a</text><text class="tiny" x="1130" y="245">b</text><text class="tiny" x="1130" y="310">c</text>
  <path class="wire" d="M1080 180 H1175 M1250 180 H1305"/><circle class="term" cx="1175" cy="180" r="4"/><circle class="term" cx="1250" cy="180" r="4"/><path class="wire" d="M1175 180 L1242 148"/>
  <path class="wire" d="M1080 245 H1175 M1250 245 H1305"/><circle class="term" cx="1175" cy="245" r="4"/><circle class="term" cx="1250" cy="245" r="4"/><path class="wire" d="M1175 245 L1242 213"/>
  <path class="wire" d="M1080 310 H1175 M1250 310 H1305"/><circle class="term" cx="1175" cy="310" r="4"/><circle class="term" cx="1250" cy="310" r="4"/><path class="wire" d="M1175 310 L1242 278"/>
  <path class="dash" d="M1212 180 V310"/>
  <rect class="sym" x="1305" y="160" width="110" height="42"/><rect class="sym" x="1305" y="225" width="110" height="42"/><rect class="sym" x="1305" y="290" width="110" height="42"/>
  <text class="tiny" x="1360" y="186" text-anchor="middle">R_KM_A</text><text class="tiny" x="1360" y="251" text-anchor="middle">R_KM_B</text><text class="tiny" x="1360" y="316" text-anchor="middle">R_KM_C</text>
  <path class="wire" d="M1415 180 V280 M1415 245 V280 M1415 310 V280"/>
  <path class="wire" d="M650 455 H1080 V180 M1080 180 V310"/>

  <!-- KM auxiliary changeover -->
  <text class="small" x="1220" y="385" text-anchor="middle">KM AUX CHANGEOVER</text>
  <text class="tiny" x="1220" y="401" text-anchor="middle">1-2 NO / 2-3 NC</text>
  <path class="wire" d="M1080 405 H1175"/><circle class="term" cx="1175" cy="405" r="4"/><circle class="term" cx="1255" cy="365" r="4"/><circle class="term" cx="1255" cy="445" r="4"/>
  <path class="wire" d="M1175 405 L1247 370"/><path class="thin" d="M1175 405 L1247 440"/>
  <text class="tiny" x="1158" y="399">2</text><text class="tiny" x="1261" y="360">1</text><text class="tiny" x="1261" y="458">3</text>
  <rect class="sym" x="1290" y="344" width="120" height="40"/><rect class="sym" x="1290" y="424" width="120" height="40"/>
  <text class="tiny" x="1350" y="369" text-anchor="middle">R_KM_NO</text><text class="tiny" x="1350" y="449" text-anchor="middle">R_KM_NC</text>
  <path class="wire" d="M1255 365 H1290 M1255 445 H1290 M1410 365 V280 M1410 445 V280"/>

  <!-- DC input block -->
  <text class="txt" x="90" y="655">X2</text>
  <rect class="sym" x="85" y="675" width="75" height="190"/>
  <text class="small" x="96" y="735">DC+</text><text class="small" x="96" y="825">DC-</text>
  <circle class="term" cx="160" cy="730" r="5"/><circle class="term" cx="160" cy="820" r="5"/>

  <!-- S0 DC pole and Q2 -->
  <path class="wire" d="M165 730 H285 M355 730 H430"/>
  <circle class="term" cx="285" cy="730" r="4"/><circle class="term" cx="355" cy="730" r="4"/><path class="wire" d="M285 730 L347 698"/>
  <path class="dash" d="M320 180 V730"/>
  <text class="tiny" x="337" y="455">MECH LINK</text>
  <path class="wire" d="M165 820 H1640"/>
  <text class="tiny" x="1560" y="810">DC- RETURN</text>
  <text class="txt" x="515" y="655" text-anchor="middle">Q2</text><text class="tiny" x="515" y="672" text-anchor="middle">DC CB</text>
  <path class="wire" d="M430 730 H480 M550 730 H620"/><rect class="sym" x="480" y="719" width="70" height="22"/>
  <path class="wire" d="M620 730 H1610"/>
  <text class="tiny" x="1450" y="718">DC CONTROL BUS +28V</text>

  <!-- HL DC -->
  <path class="wire" d="M405 730 V775 H465 V730"/>
  <circle class="sym" cx="435" cy="775" r="22"/><path class="thin" d="M425 775 H445 M435 765 V785"/>
  <text class="tiny" x="435" y="808" text-anchor="middle">HL_DC</text><text class="tiny" x="435" y="820" text-anchor="middle">DC PWR</text>
  <path class="wire" d="M435 797 V820"/>

  <!-- S1, KA coil, HL KA -->
  <text class="small" x="790" y="665">KA CONTROL BRANCH</text>
  <path class="wire" d="M760 730 V770 H825"/>
  <text class="txt" x="885" y="748" text-anchor="middle">S1</text>
  <circle class="term" cx="825" cy="770" r="4"/><circle class="term" cx="945" cy="770" r="4"/><path class="wire" d="M825 770 L937 715"/>
  <path class="wire" d="M945 770 H1010"/>
  <rect class="sym" x="1010" y="740" width="155" height="60"/>
  <text class="txt" x="1088" y="767" text-anchor="middle">KA COIL</text><text class="tiny" x="1088" y="787" text-anchor="middle">28 VDC</text>
  <text class="tiny" x="1015" y="732">A1</text><text class="tiny" x="1145" y="732">A2</text>
  <path class="wire" d="M1165 770 H1210 V820"/>
  <path class="wire" d="M985 770 V860 H1190 V770"/>
  <circle class="sym" cx="1088" cy="860" r="23"/><path class="thin" d="M1078 860 H1098 M1088 850 V870"/>
  <text class="tiny" x="1088" y="895" text-anchor="middle">HL_KA (BLUE)</text>
  <path class="wire" d="M1088 883 V820"/>
  <path class="dash" d="M1088 740 V520 H797 V450"/>

  <!-- S2, KM coil, HL KM -->
  <text class="small" x="1330" y="665">KM CONTROL BRANCH</text>
  <path class="wire" d="M1320 730 V770 H1385"/>
  <text class="txt" x="1445" y="748" text-anchor="middle">S2</text>
  <circle class="term" cx="1385" cy="770" r="4"/><circle class="term" cx="1505" cy="770" r="4"/><path class="wire" d="M1385 770 L1497 715"/>
  <path class="wire" d="M1505 770 H1555"/>
  <rect class="sym" x="1555" y="740" width="155" height="60"/>
  <text class="txt" x="1633" y="767" text-anchor="middle">KM COIL</text><text class="tiny" x="1633" y="787" text-anchor="middle">28 VDC</text>
  <text class="tiny" x="1560" y="732">A1</text><text class="tiny" x="1690" y="732">A2</text>
  <path class="wire" d="M1710 770 H1740 V820"/>
  <path class="wire" d="M1530 770 V860 H1730 V770"/>
  <circle class="sym" cx="1633" cy="860" r="23"/><path class="thin" d="M1623 860 H1643 M1633 850 V870"/>
  <text class="tiny" x="1633" y="895" text-anchor="middle">HL_KM (BLUE)</text>
  <path class="wire" d="M1633 883 V820"/>
  <path class="dash" d="M1633 740 V540 H1212 V450"/>

  <!-- Documentation box -->
  <rect class="sym" x="85" y="945" width="1030" height="175"/>
  <text class="small" x="110" y="973">SIMULATION NOTES</text>
  <text class="tiny" x="110" y="997">S0: linked AC and DC poles. Q1: AC main-circuit breaker. Q2: DC control-circuit breaker.</text>
  <text class="tiny" x="110" y="1018">S1 energizes KA and HL_KA in parallel. S2 energizes KM and HL_KM in parallel.</text>
  <text class="tiny" x="110" y="1039">KA contacts a-d and KM contacts a-c are normally open. Auxiliary contacts are 1-2 NO / 2-3 NC.</text>
  <text class="tiny" x="110" y="1060">PE is bonded to chassis only; it is not a current-carrying control conductor.</text>
  <text class="tiny" x="110" y="1096">CONTACT RATINGS: KA 10 A ALL CONTACTS. KM 25 A ALL CONTACTS.</text>

  <!-- title block without drawing title -->
  <path class="thin" d="M1250 1060 H1780 M1250 1105 H1780 M1430 1060 V1230 M1590 1060 V1230 M1700 1060 V1230"/>
  <text class="tiny" x="1265" y="1084">DWG NO.</text><text class="txt" x="1265" y="1128">TRN-REL-001</text>
  <text class="tiny" x="1445" y="1084">REV</text><text class="txt" x="1445" y="1128">A</text>
  <text class="tiny" x="1605" y="1084">SHEET</text><text class="txt" x="1605" y="1128">1 / 1</text>
  <text class="tiny" x="50" y="1205">CONCEPTUAL TRAINING SCHEMATIC. VERIFY ACTUAL COMPONENT RATINGS, VOLTAGES, PROTECTION AND WIRING AGAINST APPROVED AIRCRAFT DATA.</text>
</svg>
